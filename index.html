<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKANDA - Sistem SKP SMKN Dander</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--ink:#14302f;--pine:#0e5a4f;--pine2:#0b4a41;--mist:#eef3f2;--line:#d6e0de;--amber:#e8a317;--red:#c2410c;--ok:#15803d;--mut:#5b7270;--r:12px;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--mist);color:var(--ink);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:0;background:var(--pine);color:#fff;padding:9px 16px;border-radius:9px;font-weight:600;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--pine2)}.btn:disabled{opacity:.55;cursor:wait}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.sec:hover{background:var(--mist)}
.btn.warn{background:var(--amber);color:#2a1c00}.btn.del{background:#fff;color:var(--red);border:1px solid #f0c9b8}
.btn.sm{padding:5px 10px;font-size:12px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff}
input:focus,select:focus,textarea:focus,.btn:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
label{display:block;font-weight:600;font-size:12.5px;margin:12px 0 4px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 10px}.mut{color:var(--mut)}
#boot{position:fixed;inset:0;background:var(--pine);display:grid;place-items:center;z-index:99;transition:opacity .4s}
.ring{width:54px;height:54px;border-radius:50%;border:5px solid rgba(255,255,255,.2);border-top-color:var(--amber);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.login{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr}
.hero{background:var(--pine);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:flex-end}
.hero b{font-size:clamp(44px,7vw,84px);letter-spacing:-2px;line-height:1;font-weight:800}
.hero p{max-width:380px;opacity:.85}.hlogo{width:112px;height:auto;margin-bottom:22px;align-self:flex-start}.hero i{display:block;width:70px;height:6px;background:var(--amber);margin:18px 0;border-radius:3px}
.lform{display:grid;place-items:center;padding:24px}.lform form{width:100%;max-width:340px}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100%}
aside{background:var(--ink);color:#d9e6e4;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;overflow:auto}
aside .brand{font-weight:800;font-size:20px;color:#fff;padding:6px 10px 14px}aside .brand small{display:block;font-weight:500;font-size:11px;opacity:.6}
aside a{padding:10px 12px;border-radius:9px;cursor:pointer;display:flex;gap:10px;align-items:center}
aside a:hover{background:rgba(255,255,255,.08)}aside a.on{background:var(--amber);color:#2a1c00;font-weight:700}
.who{margin-top:auto;padding:10px;font-size:12px;border-top:1px solid rgba(255,255,255,.12)}
main{padding:24px;min-width:0}.top{display:none}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:16px 0}
.stat b{display:block;font-size:30px;font-weight:800;color:var(--pine)}
.bar{display:grid;grid-template-columns:150px 1fr 30px;gap:10px;align-items:center;margin:8px 0}
.bar div div{height:12px;background:var(--pine);border-radius:6px;min-width:3px}.bar div{background:var(--mist);border-radius:6px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:12px 0}
.tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:20px;cursor:pointer;font-weight:600}
.tabs button.on{background:var(--pine);color:#fff;border-color:var(--pine)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mut)}
.pill{padding:2px 9px;border-radius:12px;font-size:11.5px;font-weight:700;background:#dcefe6;color:var(--ok)}.pill.off{background:#f7ddd2;color:var(--red)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sk{height:16px;border-radius:6px;background:linear-gradient(90deg,#e3ebea,#f3f7f6,#e3ebea);background-size:200% 100%;animation:sh 1.2s infinite;margin:10px 0}
@keyframes sh{to{background-position:-200% 0}}
#toast{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:90}
.t{background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;box-shadow:0 6px 20px #0003;animation:in .25s}.t.e{background:var(--red)}
@keyframes in{from{transform:translateY(10px);opacity:0}}
#modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:80;padding:14px}
#modal.on{display:grid}#modal>div{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:520px;max-height:92vh;overflow:auto}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--pine);animation:sp .8s linear infinite;margin-bottom:10px}
.thumb{width:64px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
#print{display:none}
@media(max-width:860px){
 .login{grid-template-columns:1fr}.hero{padding:28px;min-height:200px}
 .shell{grid-template-columns:1fr}.top{display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:30}
 aside{position:fixed;left:0;top:0;z-index:40;width:260px;transform:translateX(-100%);transition:transform .25s}aside.open{transform:none}
 #ov{position:fixed;inset:0;background:#0006;z-index:35;display:none}#ov.on{display:block}
 .grid4{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}main{padding:14px}.bar{grid-template-columns:110px 1fr 24px}}
@media print{
 @page{size:A4;margin:0}
 body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}body>*:not(#print){display:none!important}
 #print{display:block;font:12pt 'Times New Roman',serif;color:#000}
 #print .wrap{width:100%;border-collapse:collapse;page-break-after:always}#print .wrap:last-child{page-break-after:auto}
 #print .wrap>thead>tr>td,#print .wrap>tfoot>tr>td{padding:0;border:0}#print .sp{height:15mm}
 #print .wrap>tbody>tr>td.in{padding:0 15mm;border:0}
 #print .kop{position:relative;min-height:72px;text-align:center;border-bottom:3px double #000;padding-bottom:6px;margin-bottom:14px;line-height:1.3}#print .kop img{position:absolute;left:0;top:0;height:72px}
 #print .tb{border:1px solid #000;margin-bottom:6px}#print .tb th,#print .tb td{border:1px solid #000;padding:5px 7px;color:#000}#print .tb th{background:#eee}#print tr{page-break-inside:avoid}
 #print img.d{max-width:60mm;max-height:45mm}#print .ttd{margin:28px 0 0 auto;width:75mm;text-align:center;page-break-inside:avoid}#print .ttd img{height:60px}
}
</style>
</head>

const NAV_EMP = [['dash','Dashboard'],['profil','Profil Saya'],['jurnal','Jurnal Kegiatan'],['laporan','Laporan SKP'],['pass','Ganti Password']];
const NAV_ADMIN = [['pegawai','Master Pegawai'],['setting','Pengaturan Laporan']];
const loc = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString();
const S = {token:localStorage.skToken||'', user:null, view:'dash', tgt:'', tab:0, emps:[], set:{}, bulan:loc().slice(0,7)};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const img = id => 'https://drive.google.com/thumbnail?id=' + id + '&sz=w900';
const thumb = id => `<img class="thumb" src="${img(id)}" onerror="this.onerror=null;this.src='https://lh3.googleusercontent.com/d/${id}=w300'">`;
const today = () => loc().slice(0,10);

async function call(action, data = {}) {
  if (API_URL.startsWith('PASTE')) throw new Error('API_URL belum diisi di skanda.html');
  const r = await fetch(API_URL, {method:'POST', body:JSON.stringify({action, token:S.token, ...data})});
  const j = await r.json();
  if (!j.ok) { if (/Sesi berakhir/.test(j.error)) logout(true); throw new Error(j.error); }
  return j.data;
}
function toast(m, err) { const d = document.createElement('div'); d.className = 't' + (err ? ' e' : ''); d.textContent = (err ? '❌ ' : '✅ ') + m; $('#toast').append(d); setTimeout(() => d.remove(), 3800); }
async function busy(btn, label, fn) {
  const t = btn.textContent; btn.disabled = true; btn.textContent = label;
  try { return await fn(); } catch (e) { toast(e.message, 1); } finally { btn.disabled = false; btn.textContent = t; }
}
function modal(h) { $('#modal').innerHTML = '<div>' + h + '</div>'; $('#modal').classList.add('on'); }
function closeM() { $('#modal').classList.remove('on'); }
function confirmBox(msg) {
  return new Promise(res => {
    modal('<h2>⚠️ Konfirmasi</h2><p>' + msg + '</p><div class="row" style="justify-content:flex-end"><button class="btn sec" id="cn">Batal</button><button class="btn warn" id="cy">Lanjutkan</button></div>');
    $('#cn').onclick = () => { closeM(); res(false); }; $('#cy').onclick = () => { closeM(); res(true); };
  });
}
const skel = () => '<div class="card"><div class="sk" style="width:40%"></div><div class="sk"></div><div class="sk" style="width:80%"></div><div class="sk"></div></div>';
const isAdmin = () => S.user && S.user.role === 'Admin';
const tgtNip = () => S.tgt || S.user.nip;
function menu(o) { document.querySelector('aside')?.classList.toggle('open', !!o); $('#ov').classList.toggle('on', !!o); }

// ====== Login & shell ======
function loginView() {
  $('#app').innerHTML = `<div class="login"><div class="hero"><img class="hlogo" src="${LOGO}" alt="Logo SMK Negeri Dander"><b>SKANDA</b><i></i><p>Sistem SKP SMKN Dander. Catat jurnal harian, susun SKP berbasis BerAKHLAK, cetak laporan formal.</p></div>
  <div class="lform"><form id="lf"><h1>Masuk</h1><p class="mut">Gunakan NIP dan password dari admin.</p>
  <label>NIP</label><input id="nip" autocomplete="username" required><label>Password</label><input id="pw" type="password" autocomplete="current-password" required>
  <button class="btn" style="width:100%;margin-top:18px" id="lb">Masuk</button></form></div></div>`;
  $('#lf').onsubmit = e => { e.preventDefault(); busy($('#lb'), 'Memeriksa...', async () => {
    const d = await call('login', {nip:$('#nip').value, password:$('#pw').value});
    S.token = d.token; S.user = d.user; localStorage.skToken = d.token; S.view = 'dash'; await boot2();
  }); };
}
function logout(silent) { localStorage.removeItem('skToken'); S.token = ''; S.user = null; S.tgt = ''; loginView(); if (!silent) toast('Anda sudah keluar'); }
async function boot2() {
  S.set = await call('getSettings');
  if (isAdmin()) S.emps = await call('listEmp');
  shell();
}
function shell() {
  const nav = NAV_EMP.concat(isAdmin() ? NAV_ADMIN : []);
  $('#app').innerHTML = `<div class="top"><button class="btn sec sm" onclick="menu(1)">☰</button><b>SKANDA</b></div><div class="shell"><aside>
  <div class="brand">SKANDA<small>SKP SMKN Dander</small></div>
  ${nav.map(n => `<a data-v="${n[0]}" class="${S.view === n[0] ? 'on' : ''}" onclick="go('${n[0]}')">${n[1]}</a>`).join('')}
  <div class="who"><b>${esc(S.user.nama)}</b><br>${esc(S.user.role)}<br><a onclick="logout()" style="padding:6px 0;color:var(--amber)">Keluar</a></div></aside><main id="main"></main></div>`;
  go(S.view);
}
async function go(v) {
  S.view = v; menu(0);
  document.querySelectorAll('aside a[data-v]').forEach(a => a.classList.toggle('on', a.dataset.v === v));
  $('#main').innerHTML = skel();
  try { $('#main').innerHTML = await VIEWS[v](); } catch (e) { $('#main').innerHTML = '<div class="card">Gagal memuat: ' + esc(e.message) + '</div>'; }
  scrollTo(0, 0);
}
function picker() {
  if (!isAdmin()) return '';
  return `<div class="row" style="margin:8px 0"><span class="mut">Pegawai:</span><select style="max-width:300px" onchange="S.tgt=this.value;go(S.view)">
  ${S.emps.map(e => `<option value="${esc(e.nip)}" ${tgtNip() == e.nip ? 'selected' : ''}>${esc(e.nama)} (${esc(e.nip)})</option>`).join('')}</select></div>`;
}

  const withDok = d.kegiatan.filter(k => d.dok.some(x => x.kegiatanId === k.id)).length, tot = d.kegiatan.length;
  return `<h1>Dashboard</h1>${picker()}<div class="grid4">
   <div class="card stat"><b>${d.jurnal}</b>Total Jurnal</div><div class="card stat"><b>${tot}</b>Kegiatan SKP</div>

   <div class="two"><div class="card"><h2>Sebaran kegiatan per nilai</h2>${NILAI.map((n, i) => `<div class="bar"><span>${n}</span><div><div style="width:${cnt[i] / max * 100}%"></div></div><b>${cnt[i]}</b></div>`).join('')}</div>
   <div class="card"><h2>Kelengkapan dokumentasi</h2><div class="bar" style="grid-template-columns:1fr 40px"><div><div style="width:${tot ? withDok / tot * 100 : 0}%;background:var(--amber)"></div></div><b>${tot ? Math.round(withDok / tot * 100) : 0}%</b></div>
   <p class="mut">${withDok} dari ${tot} kegiatan sudah punya foto bukti.${tot - withDok > 0 ? ' Lengkapi di menu Laporan SKP.' : ''}</p></div></div>`;
 },
 async profil() {

  <label>Nama</label><input id="pn" value="${esc(u.nama)}"><label>Jabatan</label><input id="pj" value="${esc(u.jabatan)}"><label>Unit kerja</label><input id="pu" value="${esc(u.unit)}">
  <button class="btn" style="margin-top:16px" onclick="saveProfil(this)">Simpan profil</button></div>
  <div class="card" style="max-width:560px;margin-top:14px"><h2>Tanda tangan</h2>

const val = id => $('#' + id).value.trim();
const monthPick = () => `<div class="row" style="margin:8px 0"><span class="mut">Bulan:</span><input type="month" value="${S.bulan}" style="max-width:180px" onchange="S.bulan=this.value||S.bulan;go(S.view)"></div>`;
function smallImg(file, mw, mh, clear) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, mw / im.width, mh / im.height);
      for (const z of [1, .8, .6, .45, .3, .2]) {
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(im.width * k * z)); c.height = Math.max(1, Math.round(im.height * k * z));
        const x = c.getContext('2d'); x.drawImage(im, 0, 0, c.width, c.height);
        if (clear) { const g = x.getImageData(0, 0, c.width, c.height), q = g.data; for (let i = 0; i < q.length; i += 4) if (q[i] > 200 && q[i + 1] > 200 && q[i + 2] > 200) q[i + 3] = 0; x.putImageData(g, 0, 0); }
        const u = c.toDataURL('image/png'); if (u.length < 45000) return res(u);
      }
      rej(new Error('Gambar terlalu rumit. Gunakan gambar yang lebih sederhana.'));
    };
    im.onerror = () => rej(new Error('File bukan gambar')); im.src = URL.createObjectURL(file);
  });
}
async function saveProf() { const o = {nama:val('pn'), jabatan:val('pj'), unit:val('pu'), ttd:S.user.ttd || ''}; await call('saveProfile', o); Object.assign(S.user, o); }

async function upTtd(inp) { const f = inp.files[0]; if (!f) return; try { S.user.ttd = await smallImg(f, 420, 170, true); await saveProf(); toast('Tanda tangan berhasil disimpan.'); go('profil'); } catch (e) { toast(e.message, 1); } }
async function delTtd() { S.user.ttd = ''; try { await saveProf(); toast('Tanda tangan dihapus.'); go('profil'); } catch (e) { toast(e.message, 1); } }
async function upLogo(inp) { const f = inp.files[0]; if (!f) return; try { const u = await smallImg(f, 220, 220, false); await call('saveSettings', {data:{logo:u}}); S.set.logo = u; toast('Logo kop disimpan.'); go('setting'); } catch (e) { toast(e.message, 1); } }
async function delLogo() { try { await call('saveSettings', {data:{logo:''}}); S.set.logo = ''; toast('Logo dihapus.'); go('setting'); } catch (e) { toast(e.message, 1); } }

async function setJN(id, nilai) { try { await call('setJurnalNilai', {id, nilai, nip:tgtNip()}); toast('Nilai jurnal diubah.'); } catch (e) { toast(e.message, 1); } }
async function chPw(b) { if (val('p2') !== val('p3')) return toast('Konfirmasi password tidak sama', 1); busy(b, 'Menyimpan...', async () => { await call('changePw', {lama:val('p1'), baru:val('p2')}); toast('Password berhasil diganti.'); go('pass'); }); }
async function addJ(b) { if (!val('ju')) return toast('Uraian wajib diisi', 1); sendItems([{tanggal:val('jt') || today(), uraian:val('ju')}]); }
async function delJ(id) { if (!await confirmBox('Hapus catatan jurnal ini?')) return; try { await call('delJurnal', {id, nip:tgtNip()}); toast('Jurnal dihapus.'); go('jurnal'); } catch (e) { toast(e.message, 1); } }
function nd(v) {
  let d; if (typeof v === 'number') d = new Date(Math.round((v - 25569) * 864e5));
  else { const m = String(v).trim().match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/); d = m ? new Date(Date.UTC(+m[3], m[2] - 1, +m[1])) : new Date(v); }
  return isNaN(d) ? today() : d.toISOString().slice(0, 10);
}
function parseLines(txt) {
  return txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const m = l.match(/^([^;,\t]{6,12})[;,\t]\s*(.+)$/); if (m && !isNaN(new Date(nd(m[1])).getTime()) && /\d/.test(m[1])) return {tanggal:nd(m[1]), uraian:m[2].replace(/^"|"$/g, '')};
    return {tanggal:today(), uraian:l};
  });
}
async function sendItems(items) {
  if (!items.length) return toast('Tidak ada data yang terbaca', 1);
  $('#main').innerHTML = '<div class="card"><div class="spin"></div>Menyimpan ' + items.length + ' kegiatan dan mengelompokkannya dengan AI. Mohon tunggu...</div>';
  try {
    const r = await call('addJurnal', {nip:tgtNip(), items});
    S.bulan = items.map(x => x.tanggal).sort().pop().slice(0, 7);
    toast(r.ai ? r.n + ' kegiatan disimpan dan dikelompokkan AI.' : r.n + ' kegiatan disimpan. Pengelompokan AI gagal: ' + r.err, !r.ai);
  } catch (e) { toast(e.message, 1); }
  go('jurnal');
}
async function impText(b) { sendItems(parseLines($('#jx').value)); }
async function impFile(inp) {
  const f = inp.files[0]; if (!f) return;
  try {
    let items;
    if (/\.(xlsx?|XLSX?)$/.test(f.name)) {
      const wb = XLSX.read(await f.arrayBuffer(), {type:'array'}); const r = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true});
      items = r.filter(x => x.length).map(x => x.length > 1 ? {tanggal:nd(x[0]), uraian:String(x[1] ?? '')} : {tanggal:today(), uraian:String(x[0])}).filter(x => x.uraian && !/^uraian/i.test(x.uraian));
    } else items = parseLines(await f.text()).filter(x => !/^(tanggal|uraian)/i.test(x.uraian));
    await sendItems(items);
  } catch (e) { toast('Gagal impor: ' + e.message, 1); }
}
async function saveNilai(b) { busy(b, 'Menyimpan...', async () => { await call('saveNilai', {nip:tgtNip(), nilai:NILAI[S.tab], deskripsi:val('nd')}); toast('Deskripsi disimpan.'); }); }
function editK(id) {

  modal(`<h2>${id ? 'Edit' : 'Tambah'} kegiatan</h2><label>Kegiatan</label><textarea id="k1" rows="2">${esc(k.kegiatan)}</textarea><label>Output yang dihasilkan</label><input id="k2" value="${esc(k.output)}">

async function delK(id) { if (!await confirmBox('Hapus kegiatan ini beserta foto buktinya?')) return; try { await call('delKegiatan', {id, nip:tgtNip()}); toast('Kegiatan dihapus.'); go('laporan'); } catch (e) { toast(e.message, 1); } }
function compress(file) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => { const s = Math.min(1, 1000 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * s; c.height = im.height * s; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .72)); }; im.onerror = () => rej(new Error('File bukan gambar')); im.src = URL.createObjectURL(file); });
}
async function upFoto(inp, kid) {

  try { await call('uploadFoto', {nip:tgtNip(), nilai:NILAI[S.tab], kegiatanId:kid, data:await compress(f)}); toast('Foto bukti berhasil diunggah.'); go('laporan'); } catch (e) { toast(e.message, 1); }

// ====== Cetak PDF (A4) ======
const wrap = h => `<table class="wrap"><thead><tr><td><div class="sp"></div></td></tr></thead><tbody><tr><td class="in">${h}</td></tr></tbody><tfoot><tr><td><div class="sp"></div></td></tr></tfoot></table>`;
async function printSkp(b) {
  busy(b, 'Menyiapkan...', async () => {
    const d = await call('getSkp', {nip:tgtNip(), bulan:S.bulan}), st = S.set = await call('getSettings'), p = d.emp;
    const used = NILAI.filter(n => d.kegiatan.some(k => k.nilai === n));
    if (!used.length) throw new Error('Belum ada kegiatan SKP bulan ini untuk dicetak');
    const ids = d.dok.map(x => x.fileId), foto = {};
    for (let i = 0; i < ids.length; i += 5) Object.assign(foto, await call('fotoData', {nip:tgtNip(), ids:ids.slice(i, i + 5)}));
    const [y, m] = S.bulan.split('-').map(Number), tgl = new Date(y, m, 0).toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'});
    const kop = `<div class="kop"><img src="${st.logo || LOGO}"><div>${esc(st.pemerintah)}<br>${esc(st.dinas)}<br><b style="font-size:14pt">${esc(st.sekolah)}</b><br><small>${esc(st.alamat)} Telp. ${esc(st.telepon)}</small></div></div>`;
    const ttd = `<div class="ttd">${esc(st.kota)}, ${tgl}<br>${esc(p.jabatan)}<br>${p.ttd ? `<img src="${p.ttd}"><br>` : '<br><br><br>'}<b><u>${esc(p.nama)}</u></b><br>NIP. ${esc(p.nip)}</div>`;
    let h = '';
    used.forEach((n, i) => {
      const ks = d.kegiatan.filter(k => k.nilai === n), nl = d.nilai.find(x => x.nilai === n);
      h += wrap(`${kop}<h3 style="text-align:center;margin:0 0 8px">${n.toUpperCase()}</h3><p style="text-align:justify">${esc(nl ? nl.deskripsi : DESC[n])}</p>
      <table class="tb"><tr><th style="width:7%">No.</th><th>Kegiatan</th><th>Output yang dihasilkan</th><th>Tujuan</th></tr>${ks.map((k, j) => `<tr><td>${j + 1}</td><td>${esc(k.kegiatan)}</td><td>${esc(k.output)}</td><td>${esc(k.tujuan)}</td></tr>`).join('')}</table>
      <h4 style="text-align:center;margin:18px 0 8px">DOKUMENTASI KEGIATAN</h4><table class="tb"><tr><th style="width:7%">No.</th><th style="width:38%">Kegiatan</th><th>Dokumentasi</th></tr>
      ${ks.map((k, j) => { const x = d.dok.find(o => o.kegiatanId === k.id), f = x && foto[x.fileId]; return `<tr><td>${j + 1}</td><td>${esc(k.kegiatan)}</td><td>${f ? `<img class="d" src="${f}">` : ''}</td></tr>`; }).join('')}</table>
      ${i === used.length - 1 ? ttd : ''}`);
    });
    $('#print').innerHTML = h;
    await Promise.all([...document.querySelectorAll('#print img')].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; setTimeout(r, 6000); })));
    const old = document.title; document.title = 'SKP ' + p.nama + ' ' + S.bulan;
    window.onafterprint = () => { document.title = old; $('#print').innerHTML = ''; };
    print();
  });
}
