<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e5a4f">
<meta name="mobile-web-app-capable" content="yes">
<title>SKANDA - Sistem SKP SMKN Dander</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root{--ink:#14302f;--pine:#0e5a4f;--pine2:#0b4a41;--mist:#eef3f2;--line:#d6e0de;--amber:#e8a317;--red:#c2410c;--ok:#15803d;--mut:#5b7270;--r:12px;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--mist);color:var(--ink);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:0;background:var(--pine);color:#fff;padding:9px 16px;border-radius:9px;font-weight:600;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--pine2)}.btn:disabled{opacity:.55;cursor:wait}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.sec:hover{background:var(--mist)}
.btn.warn{background:var(--amber);color:#2a1c00}.btn.del{background:#fff;color:var(--red);border:1px solid #f0c9b8}
.btn.sm{padding:5px 10px;font-size:12px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff}
input:focus,select:focus,textarea:focus,.btn:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
label{display:block;font-weight:600;font-size:12.5px;margin:12px 0 4px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 10px}.mut{color:var(--mut)}
#boot{position:fixed;inset:0;background:var(--pine);display:grid;place-items:center;z-index:99;transition:opacity .4s}
.ring{width:54px;height:54px;border-radius:50%;border:5px solid rgba(255,255,255,.2);border-top-color:var(--amber);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.login{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr}
.hero{background:var(--pine);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:flex-end}
.hero b{font-size:clamp(44px,7vw,84px);letter-spacing:-2px;line-height:1;font-weight:800}
.hero p{max-width:380px;opacity:.85}.hlogo{width:124px;height:auto;margin-bottom:22px;align-self:flex-start;filter:drop-shadow(0 10px 16px #0007);animation:spin3d 1.5s cubic-bezier(.2,.8,.2,1) both,floaty 4.5s ease-in-out 1.5s infinite}
@keyframes spin3d{from{transform:perspective(600px) rotateY(-540deg) scale(.4);opacity:0}to{transform:perspective(600px) rotateY(0) scale(1);opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-12px) rotate(1.5deg)}}
.bootlogo{width:112px;animation:pulse 1.3s ease-in-out infinite;filter:drop-shadow(0 8px 14px #0006)}@keyframes pulse{50%{transform:scale(1.1)}}
@media(prefers-reduced-motion:reduce){.hlogo,.bootlogo{animation:none}}.hero i{display:block;width:70px;height:6px;background:var(--amber);margin:18px 0;border-radius:3px}
.lform{display:grid;place-items:center;padding:24px}.lform form{width:100%;max-width:340px}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100%}
aside{background:var(--ink);color:#d9e6e4;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;overflow:auto}
aside .brand{font-weight:800;font-size:20px;color:#fff;padding:6px 10px 14px}aside .brand small{display:block;font-weight:500;font-size:11px;opacity:.6}
aside a{padding:10px 12px;border-radius:9px;cursor:pointer;display:flex;gap:10px;align-items:center}
aside a:hover{background:rgba(255,255,255,.08)}aside a.on{background:var(--amber);color:#2a1c00;font-weight:700}
.who{margin-top:auto;padding:10px;font-size:12px;border-top:1px solid rgba(255,255,255,.12)}
main{padding:24px;min-width:0}.top{display:none}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:16px 0}
.stat b{display:block;font-size:30px;font-weight:800;color:var(--pine)}
.bar{display:grid;grid-template-columns:150px 1fr 30px;gap:10px;align-items:center;margin:8px 0}
.bar div div{height:12px;background:var(--pine);border-radius:6px;min-width:3px}.bar div{background:var(--mist);border-radius:6px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:12px 0}
.tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:20px;cursor:pointer;font-weight:600}
.tabs button.on{background:var(--pine);color:#fff;border-color:var(--pine)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mut)}
.pill{padding:2px 9px;border-radius:12px;font-size:11.5px;font-weight:700;background:#dcefe6;color:var(--ok)}.pill.off{background:#f7ddd2;color:var(--red)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.sk{height:16px;border-radius:6px;background:linear-gradient(90deg,#e3ebea,#f3f7f6,#e3ebea);background-size:200% 100%;animation:sh 1.2s infinite;margin:10px 0}
@keyframes sh{to{background-position:-200% 0}}
#toast{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:90}
.t{background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;box-shadow:0 6px 20px #0003;animation:in .25s}.t.e{background:var(--red)}
@keyframes in{from{transform:translateY(10px);opacity:0}}
#modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:80;padding:14px}
#modal.on{display:grid}#modal>div{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:520px;max-height:92vh;overflow:auto}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--pine);animation:sp .8s linear infinite;margin-bottom:10px}
.thumb{width:64px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
#print{display:none}
@media(max-width:700px){
 .login{grid-template-columns:1fr}.hero{padding:28px;min-height:200px}
 .shell{grid-template-columns:1fr}.top{display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:30}
 aside{position:fixed;left:0;top:0;z-index:40;width:260px;transform:translateX(-100%);transition:transform .25s}aside.open{transform:none}
 #ov{position:fixed;inset:0;background:#0006;z-index:35;display:none}#ov.on{display:block}
 .grid4{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}main{padding:14px}.bar{grid-template-columns:110px 1fr 24px}}
@media(max-width:700px){
 input,select,textarea{font-size:16px}h1{font-size:19px}.card{padding:14px}
 .grid4{grid-template-columns:1fr 1fr;gap:10px}.stat b{font-size:24px}
 .row>.btn{flex:1 1 auto}
 #modal{place-items:end center;padding:0}#modal>div{border-radius:16px 16px 0 0;max-width:none}
 #toast{left:12px;right:12px;bottom:12px}
 .hero{min-height:240px;padding:24px}.hlogo{width:84px}
 table.rt tr:has(th),table.rt th{display:none}
 table.rt,table.rt tbody{display:block}
 table.rt tr{display:block;border:1px solid var(--line);border-radius:10px;padding:6px 12px;margin-bottom:10px}
 table.rt td{display:flex;gap:12px;justify-content:space-between;align-items:center;border:0;padding:6px 0;text-align:right}
 table.rt td::before{content:attr(data-label);font-weight:700;color:var(--mut);text-align:left;flex:0 0 30%}
 table.rt td[data-label=""]{justify-content:flex-end;flex-wrap:wrap}table.rt td[data-label=""]::before{display:none}
 table.rt td select{min-width:0!important;width:100%}
}
#bar{position:fixed;top:0;left:0;right:0;height:3px;background:var(--amber);z-index:100;opacity:0;pointer-events:none}
#bar.on{opacity:1;animation:bar 1.1s ease-in-out infinite}
@keyframes bar{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.sh,#bn{display:none}aside a i,#bn a i{font-style:normal}
aside .brand{display:flex;align-items:center;gap:10px}aside .brand img,.top img{width:34px;height:34px;object-fit:contain}
.who .wn{margin-bottom:6px}#main{max-width:1240px;margin-inline:auto;width:100%}
@media(pointer:coarse){.btn{min-height:42px}.btn.sm{min-height:38px}aside a{padding:12px}input,select,textarea{min-height:44px}}
@media(min-width:701px) and (max-width:1099px){
 .shell{grid-template-columns:82px 1fr}
 aside{padding:12px 6px}aside .brand{justify-content:center;padding:6px 0 12px}
 aside a{flex-direction:column;gap:2px;font-size:10.5px;padding:9px 2px;text-align:center;justify-content:center}
 aside a i{font-size:20px}.lb{display:none}.sh{display:block}.who .wn{display:none}main{padding:20px}
}
@media(max-width:700px){
 .top{padding-top:calc(10px + env(safe-area-inset-top))}.top img{width:30px;height:30px}
 #bn{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
 #bn a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px;font-size:10.5px;color:var(--mut);cursor:pointer}
 #bn a i{font-size:20px}#bn a.on{color:var(--pine);font-weight:700}
 main{padding-bottom:calc(84px + env(safe-area-inset-bottom))}#toast{bottom:calc(76px + env(safe-area-inset-bottom))}
}
@media print{
 @page{size:A4;margin:0}
 body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}body>*:not(#print){display:none!important}
 #print{display:block;font:12pt 'Times New Roman',serif;color:#000}
 #print .wrap{width:100%;border-collapse:collapse;page-break-after:always}#print .wrap:last-child{page-break-after:auto}
 #print .wrap>thead>tr>td,#print .wrap>tfoot>tr>td{padding:0;border:0}#print .sp{height:15mm}
 #print .wrap>tbody>tr>td.in{padding:0 15mm;border:0}
 #print .kop{position:relative;min-height:72px;text-align:center;border-bottom:3px double #000;padding-bottom:6px;margin-bottom:14px;line-height:1.3}#print .kop img{position:absolute;left:0;top:0;height:72px}
 #print .tb{border:1px solid #000;margin-bottom:6px}#print .tb th,#print .tb td{border:1px solid #000;padding:5px 7px;color:#000}#print .tb th{background:#eee}#print tr{page-break-inside:avoid}
 #print img.d{max-width:60mm;max-height:45mm}#print .ttd{margin:28px 0 0 auto;width:80mm;text-align:center;page-break-inside:avoid}#print .ttd img{height:30mm;max-width:72mm;object-fit:contain}
}
</style>
</head>

function smallImg(file, mw, mh, clear) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, mw / im.width, mh / im.height);
      for (const z of [1, .8, .6, .45, .3, .2]) {
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(im.width * k * z)); c.height = Math.max(1, Math.round(im.height * k * z));
        const x = c.getContext('2d'); x.drawImage(im, 0, 0, c.width, c.height);
        if (clear) { const g = x.getImageData(0, 0, c.width, c.height), q = g.data; for (let i = 0; i < q.length; i += 4) if (q[i] > 200 && q[i + 1] > 200 && q[i + 2] > 200) q[i + 3] = 0; x.putImageData(g, 0, 0); }
        const u = c.toDataURL('image/png'); if (u.length < 45000) return res(u);
      }
      rej(new Error('Gambar terlalu rumit. Gunakan gambar yang lebih sederhana.'));
    };
    im.onerror = () => rej(new Error('File bukan gambar')); im.src = URL.createObjectURL(file);
  });
}

  setCache('getJurnal', {nip:tgtNip(), bulan:S.bulan}, a => (a || []).filter(x => x.id !== id)); go('jurnal', 1);
  call('delJurnal', {id, nip:tgtNip()}).then(() => { toast('Jurnal dihapus.'); stale('getSkp'); }).catch(e => { toast(e.message, 1); bust('getJurnal'); softRefresh(); });
}
function nd(v) {
  let d; if (typeof v === 'number') d = new Date(Math.round((v - 25569) * 864e5));
  else { const m = String(v).trim().match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/); d = m ? new Date(Date.UTC(+m[3], m[2] - 1, +m[1])) : new Date(v); }
  return isNaN(d) ? today() : d.toISOString().slice(0, 10);
}
function parseLines(txt) {
  return txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const m = l.match(/^([^;,\t]{6,12})[;,\t]\s*(.+)$/); if (m && !isNaN(new Date(nd(m[1])).getTime()) && /\d/.test(m[1])) return {tanggal:nd(m[1]), uraian:m[2].replace(/^"|"$/g, '')};
    return {tanggal:today(), uraian:l};
  });
}
async function sendItems(items) {
  if (!items.length) return toast('Tidak ada data yang terbaca', 1);
  const nip = tgtNip(), bulan = items.map(x => x.tanggal).sort().pop().slice(0, 7);
  S.bulan = bulan;
  try { await get('getJurnal', {nip, bulan}, () => {}); } catch (e) { return toast(e.message, 1); }
  setCache('getJurnal', {nip, bulan}, a => (a || []).concat(items.map(x => ({id:'tmp' + Math.random().toString(36).slice(2, 8), nip, tanggal:x.tanggal, uraian:x.uraian, nilai:''}))).sort((p, q) => p.tanggal < q.tanggal ? 1 : -1));
  S.ai = (S.ai || 0) + 1; go('jurnal', 1);
  call('addJurnal', {nip, items}).then(r => toast(r.ai ? r.n + ' kegiatan disimpan dan dikelompokkan AI.' : r.n + ' kegiatan disimpan. Pengelompokan AI gagal: ' + r.err, !r.ai))
    .catch(e => toast(e.message, 1)).finally(() => { S.ai--; bust('getJurnal'); stale('getSkp'); softRefresh(); });
}
async function impText(b) { sendItems(parseLines($('#jx').value)); }
const loadXLSX = () => window.XLSX ? Promise.resolve() : new Promise((ok, no) => { const t = document.createElement('script'); t.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; t.onload = ok; t.onerror = () => no(new Error('Gagal memuat pustaka Excel. Periksa koneksi.')); document.head.append(t); });
async function impFile(inp) {
  const f = inp.files[0]; if (!f) return;
  try {
    let items;
    if (/\.(xlsx?|XLSX?)$/.test(f.name)) {
      await loadXLSX(); const wb = XLSX.read(await f.arrayBuffer(), {type:'array'}); const r = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true});
      items = r.filter(x => x.length).map(x => x.length > 1 ? {tanggal:nd(x[0]), uraian:String(x[1] ?? '')} : {tanggal:today(), uraian:String(x[0])}).filter(x => x.uraian && !/^uraian/i.test(x.uraian));
    } else items = parseLines(await f.text()).filter(x => !/^(tanggal|uraian)/i.test(x.uraian));
    await sendItems(items);
  } catch (e) { toast('Gagal impor: ' + e.message, 1); }
}
async function saveNilai(b) { busy(b, 'Menyimpan...', async () => { await call('saveNilai', {nip:tgtNip(), nilai:NILAI[S.tab], deskripsi:val('nd')}); toast('Deskripsi disimpan.'); }); }

    go('laporan', 1);

      if (!id && typeof r === 'string') setCache('getSkp', {nip, bulan}, d => { d.kegiatan = d.kegiatan.map(k => k.id === tid ? {...k, id:r} : k); return d; }); else if (!id) bust('getSkp');
      stale('getSkp'); softRefresh();
    }).catch(e => { toast(e.message, 1); bust('getSkp'); softRefresh(); });
  };
}
async function delK(id) {
  if (id.startsWith('tmp')) return toast('Tunggu sebentar, kegiatan sedang disimpan', 1);
  if (!await confirmBox('Hapus kegiatan ini beserta foto buktinya?')) return;
  const nip = tgtNip(), bulan = S.bulan;
  setCache('getSkp', {nip, bulan}, d => { d.kegiatan = d.kegiatan.filter(k => k.id !== id); d.dok = d.dok.filter(x => x.kegiatanId !== id); return d; }); go('laporan', 1);
  call('delKegiatan', {id, nip}).then(() => { toast('Kegiatan dihapus.'); stale('getSkp'); }).catch(e => { toast(e.message, 1); bust('getSkp'); softRefresh(); });
}
function compress(file, mx = 1000, q = .72) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => { const s = Math.min(1, mx / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * s; c.height = im.height * s; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', q)); }; im.onerror = () => rej(new Error('File bukan gambar')); im.src = URL.createObjectURL(file); });
}
async function upFoto(inp, kid) {
  const f = inp.files[0]; if (!f) return;
  if (kid.startsWith('tmp')) return toast('Tunggu sebentar, kegiatan sedang disimpan', 1);
  const nip = tgtNip(), bulan = S.bulan, nilai = NILAI[S.tab];
  try {
    const prev = await compress(f, 320, .55);
    setCache('getSkp', {nip, bulan}, d => { d.dok = d.dok.filter(x => x.kegiatanId !== kid).concat([{id:'tmp', nip, nilai, kegiatanId:kid, fileId:prev}]); return d; }); go('laporan', 1);
    toast('Foto diunggah di latar belakang...');
    const big = await compress(f); let small = '';
    for (const [m, q] of [[560, .6], [440, .5], [340, .45], [260, .4]]) { small = await compress(f, m, q); if (small.length < 45000) break; }
    if (small.length >= 45000) small = '';
    const r = await call('uploadFoto', {nip, nilai, kegiatanId:kid, data:big, small});
    toast(r.mode === 'sheet' ? 'Foto tersimpan (mode ringan karena izin Drive belum aktif).' : 'Foto bukti berhasil diunggah.'); stale('getSkp'); softRefresh();
  } catch (e) { toast(e.message, 1); bust('getSkp'); softRefresh(); }
}
async function gen(b) {

  busy(b, 'Menyusun (±20 detik)...', async () => { const n = await call('generate', {nip:tgtNip(), bulan:S.bulan}); toast(n + ' kegiatan SKP berhasil disusun. Silakan periksa dan edit.'); bust('getSkp'); softRefresh(); });

async function saveSet(b) { busy(b, 'Menyimpan...', async () => { const d = {}; document.querySelectorAll('[data-k]').forEach(i => d[i.dataset.k] = i.value.trim()); await call('saveSettings', {data:d}); Object.assign(S.set, d); setCache('getSettings', {}, x => ({...(x || {}), ...d})); toast('Pengaturan disimpan.'); }); }

// ====== Cetak PDF (A4) ======
const wrap = h => `<table class="wrap"><thead><tr><td><div class="sp"></div></td></tr></thead><tbody><tr><td class="in">${h}</td></tr></tbody><tfoot><tr><td><div class="sp"></div></td></tr></tfoot></table>`;
const PH = {}, PHq = new Set();
async function warm(ids) {
  const need = [...new Set(ids)].filter(i => i && !String(i).startsWith('data:') && !PH[i] && !PHq.has(i)), nip = tgtNip(), jobs = [];
  for (let i = 0; i < need.length; i += 3) {
    const c = need.slice(i, i + 3); c.forEach(x => PHq.add(x));
    jobs.push(call('fotoData', {nip, ids:c}).then(m => Object.assign(PH, m)).catch(() => {}).finally(() => c.forEach(x => PHq.delete(x))));
  }
  await Promise.all(jobs);
}
async function printSkp(b) {
  busy(b, 'Menyiapkan...', async () => {
    let d = await get('getSkp', {nip:tgtNip(), bulan:S.bulan}, () => {});
    if (!d.emp) d = await call('getSkp', {nip:tgtNip(), bulan:S.bulan});
    const st = S.set, p = d.emp, used = [NILAI[S.tab]].filter(n => d.kegiatan.some(k => k.nilai === n));
    if (!used.length) throw new Error('Belum ada kegiatan pada nilai ' + NILAI[S.tab] + ' di bulan ini');
    const ids = d.dok.filter(x => d.kegiatan.some(k => k.id === x.kegiatanId && k.nilai === used[0])).map(x => x.fileId).filter(i => !String(i).startsWith('data:'));
    for (let w = 0; w < 40 && ids.some(i => !PH[i] && PHq.has(i)); w++) await new Promise(r => setTimeout(r, 150));
    await warm(ids);
    const [y, m] = S.bulan.split('-').map(Number), tgl = new Date(y, m, 0).toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'});
    const kop = `<div class="kop"><img src="${st.logo || LOGO}"><div>${esc(st.pemerintah)}<br>${esc(st.dinas)}<br><b style="font-size:14pt">${esc(st.sekolah)}</b><br><small>${esc(st.alamat)} Telp. ${esc(st.telepon)}</small></div></div>`;
    const ttd = `<div class="ttd">${esc(st.kota)}, ${tgl}<br>${esc(p.jabatan)}<br>${p.ttd ? `<img src="${p.ttd}"><br>` : '<br><br><br>'}<b><u>${esc(p.nama)}</u></b><br>NIP. ${esc(p.nip)}</div>`;
    const n = used[0], ks = d.kegiatan.filter(k => k.nilai === n);
    $('#print').innerHTML = wrap(`${kop}<h3 style="text-align:center;margin:0 0 8px">${n.toUpperCase()}</h3><p style="text-align:justify">${esc(DESC[n])}</p>
      <table class="tb"><tr><th style="width:7%">No.</th><th>Kegiatan</th><th>Output yang dihasilkan</th><th>Tujuan</th></tr>${ks.map((k, j) => `<tr><td>${j + 1}</td><td>${esc(k.kegiatan)}</td><td>${esc(k.output)}</td><td>${esc(k.tujuan)}</td></tr>`).join('')}</table>
      <h4 style="text-align:center;margin:18px 0 8px">DOKUMENTASI KEGIATAN</h4><table class="tb"><tr><th style="width:7%">No.</th><th style="width:38%">Kegiatan</th><th>Dokumentasi</th></tr>
      ${ks.map((k, j) => { const x = d.dok.find(o => o.kegiatanId === k.id), f = x && (String(x.fileId).startsWith('data:') ? x.fileId : PH[x.fileId]); return `<tr><td>${j + 1}</td><td>${esc(k.kegiatan)}</td><td>${f && f.length > 10 ? `<img class="d" src="${f}">` : ''}</td></tr>`; }).join('')}</table>${ttd}`);
    await Promise.all([...document.querySelectorAll('#print img')].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; setTimeout(r, 6000); })));
    const old = document.title; document.title = 'SKP ' + p.nama + ' ' + n + ' ' + S.bulan;
    window.onafterprint = () => { document.title = old; $('#print').innerHTML = ''; };
    print();
  });
}
